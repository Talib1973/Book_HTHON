name: Sync backend to Hugging Face Space

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push backend to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Clone HF Space
          git clone https://TalibHussain:${HF_TOKEN}@huggingface.co/spaces/TalibHussain/book-hthon-backend hf-space

          # Sync backend/ contents into HF Space (overwrite, keep HF-only files)
          rsync -av --delete \
            --exclude='.git' \
            backend/ hf-space/

          # Commit and push if there are changes
          cd hf-space
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync from GitHub: ${{ github.sha }}"
            git push origin main
          fi
